<section class="mx-auto flex w-full max-w-md flex-col gap-6 px-4 py-10 sm:px-6 sm:py-14">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="etiqueta-promo" aria-hidden="true">Balcão de entrada</p>
      <h1
        class="mt-3 font-display text-4xl uppercase leading-none tracking-wide text-marinho sm:text-5xl"
      >
        Entrar na sua conta
      </h1>
      <p class="mt-3 text-sm text-tinta-suave">
        Acesse para gerenciar sua conta e, em breve, receber recomendações personalizadas.
      </p>
    </div>
    <span class="selo-locadora hidden shrink-0 sm:grid" aria-hidden="true">
      Locadora<br />aberta
    </span>
  </div>

  <form class="ficha-formulario" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
    <div class="cabecalho-ficha">
      <span>Atendimento</span>
      <span aria-hidden="true">Balcão 01</span>
    </div>

    <div class="flex flex-col gap-4 p-5 sm:p-6">
      <label class="campo-formulario">
        <span class="rotulo-formulario">E-mail</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          class="entrada-formulario"
          placeholder="voce@exemplo.com"
          [attr.aria-invalid]="
            formulario.controls.email.touched && formulario.controls.email.invalid
          "
        />
        @if (formulario.controls.email.touched && formulario.controls.email.invalid) {
          <span class="erro-formulario" role="alert">Informe um e-mail válido.</span>
        }
      </label>

      <label class="campo-formulario">
        <span class="rotulo-formulario">Senha</span>
        <input
          type="password"
          formControlName="senha"
          autocomplete="current-password"
          class="entrada-formulario"
          placeholder="Sua senha"
          [attr.aria-invalid]="
            formulario.controls.senha.touched && formulario.controls.senha.invalid
          "
        />
        @if (formulario.controls.senha.touched && formulario.controls.senha.invalid) {
          <span class="erro-formulario" role="alert">A senha é obrigatória.</span>
        }
      </label>

      @if (erro()) {
        <p class="aviso-formulario aviso-formulario--erro" role="alert">
          {{ erro() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="enviando()"
        class="botao-formulario botao-formulario--primario"
      >
        {{ enviando() ? 'Entrando...' : 'Entrar' }}
      </button>

      <p class="text-center text-sm text-tinta-suave">
        Ainda não tem conta?
        <a routerLink="/criar-conta" class="link-formulario">Criar conta</a>
      </p>
    </div>
  </form>
</section>
