<section class="mx-auto flex w-full max-w-6xl flex-col gap-8 px-4 py-12 sm:px-6 lg:px-8">
  <div class="max-w-2xl">
    <p class="text-sm font-semibold uppercase tracking-wide text-emerald-400">
      Fundação do GameMatch
    </p>
    <h1 class="mt-2 text-3xl font-bold text-white sm:text-4xl">
      Descubra seu próximo jogo gratuito
    </h1>
    <p class="mt-4 text-base leading-relaxed text-slate-300">
      A base da plataforma está pronta. Em breve você poderá criar seu perfil,
      explorar o catálogo e receber recomendações personalizadas.
    </p>
  </div>

  <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4 sm:p-6">
    <h2 class="text-base font-semibold text-white">Status da API</h2>
    <p class="mt-2 flex items-center gap-2 text-sm text-slate-300">
      <span
        class="inline-block h-2.5 w-2.5 shrink-0 rounded-full"
        [class.bg-emerald-400]="estado() === 'ok'"
        [class.bg-amber-400]="estado() === 'carregando'"
        [class.bg-rose-400]="estado() === 'indisponivel'"
        aria-hidden="true"
      ></span>
      <span>{{ detalhe() }}</span>
    </p>
  </div>
</section>
