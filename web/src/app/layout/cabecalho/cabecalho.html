<header class="border-b border-slate-800 bg-slate-950/90 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="flex items-center gap-2 text-lg font-semibold text-white">
      <span
        aria-hidden="true"
        class="grid h-9 w-9 place-items-center rounded-lg bg-emerald-500 text-slate-950"
      >
        <!-- Ícone gamepad-2 do Lucide em SVG inline: o pacote lucide-angular
             ainda não declara suporte ao Angular 22. -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-5 w-5"
        >
          <line x1="6" x2="10" y1="11" y2="11" />
          <line x1="8" x2="8" y1="9" y2="13" />
          <line x1="15" x2="15.01" y1="12" y2="12" />
          <line x1="18" x2="18.01" y1="10" y2="10" />
          <path
            d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"
          />
        </svg>
      </span>
      <span>GameMatch</span>
    </a>

    <nav aria-label="Navegação principal">
      <ul class="flex items-center gap-1 text-sm">
        <li>
          <a
            routerLink="/"
            routerLinkActive="bg-slate-800 text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-md px-3 py-2 text-slate-300 transition hover:bg-slate-800 hover:text-white"
          >
            Início
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
