<header class="border-b-4 border-amarelo bg-marinho text-papel">
  <div class="mx-auto flex w-full max-w-6xl flex-col gap-3 px-4 py-3 sm:px-6 lg:px-8">
    <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-3">
      <a
        routerLink="/"
        class="group flex items-center gap-3 rounded-caixa text-papel focus-visible:outline-amarelo"
      >
        <span
          aria-hidden="true"
          class="grid h-11 w-11 shrink-0 place-items-center rounded-caixa border-2 border-marinho bg-amarelo text-marinho shadow-selo transition-transform duration-200 motion-safe:group-hover:-rotate-3"
        >
          <!-- Ícone gamepad-2 do Lucide em SVG inline: o pacote lucide-angular
               ainda não declara suporte ao Angular 22. -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-6 w-6"
          >
            <line x1="6" x2="10" y1="11" y2="11" />
            <line x1="8" x2="8" y1="9" y2="13" />
            <line x1="15" x2="15.01" y1="12" y2="12" />
            <line x1="18" x2="18.01" y1="10" y2="10" />
            <path
              d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"
            />
          </svg>
        </span>

        <span class="flex flex-col leading-none">
          <span class="font-display text-3xl uppercase tracking-[0.08em]">GameMatch</span>
          <span class="mt-1 font-display text-[0.7rem] uppercase tracking-[0.3em] text-amarelo">
            Locadora de jogos
          </span>
        </span>
      </a>

      <nav aria-label="Navegação principal">
        <ul class="flex flex-wrap items-center gap-1 text-xs text-papel sm:text-sm">
          <li>
            <a
              routerLink="/"
              routerLinkActive="bg-amarelo text-marinho"
              [routerLinkActiveOptions]="{ exact: true }"
              class="inline-block rounded-etiqueta px-2.5 py-2 font-semibold transition hover:underline hover:decoration-amarelo hover:decoration-2 hover:underline-offset-4 focus-visible:outline-amarelo sm:px-3"
            >
              Início
            </a>
          </li>

          @if (autenticado()) {
            <li>
              <a
                routerLink="/catalogo"
                routerLinkActive="bg-amarelo text-marinho"
                class="inline-block rounded-etiqueta px-2.5 py-2 font-semibold transition hover:underline hover:decoration-amarelo hover:decoration-2 hover:underline-offset-4 focus-visible:outline-amarelo sm:px-3"
              >
                Catálogo
              </a>
            </li>
            <li>
              <a
                routerLink="/recomendacoes"
                routerLinkActive="bg-amarelo text-marinho"
                class="inline-block rounded-etiqueta px-2.5 py-2 font-semibold transition hover:underline hover:decoration-amarelo hover:decoration-2 hover:underline-offset-4 focus-visible:outline-amarelo sm:px-3"
              >
                Recomendações
              </a>
            </li>
            <li>
              <a
                routerLink="/favoritos"
                routerLinkActive="bg-amarelo text-marinho"
                class="inline-block rounded-etiqueta px-2.5 py-2 font-semibold transition hover:underline hover:decoration-amarelo hover:decoration-2 hover:underline-offset-4 focus-visible:outline-amarelo sm:px-3"
              >
                Favoritos
              </a>
            </li>
            <li>
              <a
                routerLink="/perfil"
                routerLinkActive="bg-amarelo text-marinho"
                class="inline-block rounded-etiqueta px-2.5 py-2 font-semibold transition hover:underline hover:decoration-amarelo hover:decoration-2 hover:underline-offset-4 focus-visible:outline-amarelo sm:px-3"
              >
                Perfil
              </a>
            </li>
            <li>
              <a
                routerLink="/conta"
                routerLinkActive="bg-amarelo text-marinho"
                class="inline-block rounded-etiqueta px-2.5 py-2 font-semibold transition hover:underline hover:decoration-amarelo hover:decoration-2 hover:underline-offset-4 focus-visible:outline-amarelo sm:px-3"
              >
                Minha conta
              </a>
            </li>
            <li class="hidden max-w-40 truncate px-2 text-papel/70 md:block">
              {{ usuario()?.email }}
            </li>
            <li>
              <button
                type="button"
                (click)="sair()"
                class="inline-block rounded-etiqueta border-2 border-vermelho bg-vermelho px-2.5 py-1.5 font-bold uppercase tracking-wide text-papel transition hover:brightness-110 focus-visible:outline-amarelo sm:px-3"
              >
                Sair
              </button>
            </li>
          } @else {
            <li>
              <a
                routerLink="/entrar"
                routerLinkActive="bg-amarelo text-marinho"
                class="inline-block rounded-etiqueta px-2.5 py-2 font-semibold transition hover:underline hover:decoration-amarelo hover:decoration-2 hover:underline-offset-4 focus-visible:outline-amarelo sm:px-3"
              >
                Entrar
              </a>
            </li>
            <li>
              <a
                routerLink="/criar-conta"
                routerLinkActive="ring-2 ring-papel"
                class="inline-block rounded-etiqueta border-2 border-marinho bg-amarelo px-3 py-1.5 font-bold text-marinho shadow-selo transition hover:-translate-y-0.5 focus-visible:outline-amarelo motion-reduce:transform-none"
              >
                Criar conta
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>
  </div>
</header>
