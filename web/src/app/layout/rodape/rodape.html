<footer class="border-t border-slate-800 bg-slate-950">
  <div
    class="mx-auto flex w-full max-w-6xl flex-col gap-3 px-4 py-6 text-sm text-slate-400 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8"
  >
    <p>GameMatch — descoberta de jogos gratuitos.</p>

    <p class="flex flex-wrap items-center gap-1">
      <span>Dados fornecidos por</span>
      <a
        [href]="urlFreetogame"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-1 font-medium text-emerald-400 transition hover:text-emerald-300"
      >
        FreeToGame.com
        <!-- Ícone external-link do Lucide em SVG inline: o pacote lucide-angular
             ainda não declara suporte ao Angular 22. -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-4 w-4"
          aria-hidden="true"
        >
          <path d="M15 3h6v6" />
          <path d="M10 14 21 3" />
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        </svg>
      </a>
    </p>
  </div>
</footer>
