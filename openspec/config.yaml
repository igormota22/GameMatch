schema: spec-driven

# Contexto do projeto (opcional)
# Inclua apenas restrições que devem orientar os artefatos e fluxos do OpenSpec.
context: |
  Fluxo de planejamento do GameMatch:

  1. `docs/prd.md` — requisitos de produto (RF, regras de negócio RB, requisitos
     não funcionais RNF e critérios de aceite CA).
  2. `docs/tdd.md` — decisões técnicas (DT), contratos, dados, riscos e roadmap
     de implementação (fases F1–F5).
  3. Change OpenSpec = SDD (Spec-Driven Development): `proposal.md` (escopo
     rastreável aos IDs do PRD/TDD), `specs/` (deltas de requisitos), `design.md`
     apenas quando houver decisão local relevante e `tasks.md` (tarefas
     verificáveis). Revise as especificações antes de implementar.
  4. Pull Request da feature branch para a `main`, usando
     `.github/pull_request_template.md`.

  PRD e TDD são documentos globais e vivos: reutilize e atualize os existentes
  em vez de recriá-los a cada change. Nenhuma implementação começa antes das
  especificações da change serem revisadas e aprovadas. Textos de interface em
  PT-BR; identificadores de domínio, métodos e variáveis em português,
  seguindo as convenções da linguagem.

# Regras por artefato (opcional)
rules:
  proposal:
    - Em português (PT-BR).
    - Descreva o escopo da change e referencie os RF/CA do `docs/prd.md` e as DT do `docs/tdd.md` afetados.
    - Não recrie requisitos nem decisões globais; aponte para os documentos existentes.
  specs:
    - Em português (PT-BR).
    - Use `### Requirement:` e `#### Scenario:` (WHEN/THEN) para requisitos testáveis.
    - Todo requisito novo ou alterado deve ser rastreável a um RF do PRD.
  design:
    - Em português (PT-BR).
    - Registre apenas decisões locais da change; decisões globais pertencem ao `docs/tdd.md`.
  tasks:
    - Em português (PT-BR).
    - Cada tarefa deve ser um checkbox `- [ ] X.Y ...` com a forma de verificação.
    - Agrupe as tarefas por fase do roadmap do TDD quando aplicável.

# Orientações por operação (opcional)
operations:
  apply:
    guidance:
      - Confirme que as especificações e tarefas da change foram revisadas antes de editar código.
      - Se a implementação alterar uma decisão registrada, atualize `docs/tdd.md` (e `docs/prd.md` se o requisito mudar) no mesmo PR.
      - Marque cada tarefa (`- [x]`) assim que a verificação dela passar.
